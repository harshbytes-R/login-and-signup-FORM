<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup form</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>

    <div class="login-container">

        <form id="form">

            <h1>Sign up</h1>
            <div class="input-box">
                <input type="text" id="name" name="Username" placeholder=" Enter Your Username">
                <i class="fa-regular fa-user"></i>
            </div>
            <div class="input-box">
                <input type="Email" id="email" name="Email" placeholder=" Enter Your Email">
                <i class="fa-regular fa-user"></i>
            </div>
            <div class="input-box">
                <input type="password" id="password" placeholder="Create Password">
                <i class="fa-solid fa-lock"></i>
            </div>
            <div class="input-box">
                <input type="password" id="confirm-password" placeholder=" Confirm-Password">
                <i class="fa-solid fa-lock"></i>
            </div>


            <button id="btn" type="submit">Sign up</button>
            <div class="register-link">
                Already have an account?<a href="login.html">Login now</a>
            </div>

        </form>

    </div>

    <script>

        const form = document.querySelector("#form");

        form.addEventListener("submit", (event) => {
            event.preventDefault();

            const name = document.querySelector("#name").value.trim();

            const email = document.querySelector("#email").value.trim();
            const password = document.querySelector("#password").value;
            const confirmPassword = document.querySelector("#confirm-password").value;

            const btn = document.querySelector("#btn");
            btn.classList.add("click");

            setTimeout(() => {
                if (name === "") {
                    alert("Enter a valid name");
                }
                else if (!/[^\s@]+@[^\s@]+[^\s@]+$/.test(email)) {
                    alert("Enter a valid email")
                }
                else if (password.length < 8) {
                    alert("Password must be at least 8 characters");
                }
                else if (confirmPassword != password) {
                    alert("Password does not match");
                }
                else {
                    alert("Sign up Complete! GO to login page ");
                    localStorage.setItem("name", name,);
                    localStorage.setItem("email", email,);    // I KNOW ITS WORNG 
                    localStorage.setItem("password", password);  
                    form.reset();

                }

            }, 100)

            setTimeout(() => {
                btn.classList.remove("click")
            }, 300)
        });

    </script>
</body>

</html>

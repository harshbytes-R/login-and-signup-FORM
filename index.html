<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login form</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>



    <!-- signup -->
    <div id="signupPage" class="login-container">

        <form id="form1">

            <h1>Sign up</h1>
            <div class="input-box">
                <input type="text" id="signupName" oninput="signupNameError.style.display = 'none' " name="Username"
                    placeholder=" Enter Your Username">
                <i class="fa-regular fa-user icon"></i>
                <p id="signupNameError" class="showerror"></p>
            </div>
            <div class="input-box">
                <input type="Email" id="signupEmail" oninput=" signupEmailError.style.display = 'none'" name="Email"
                    placeholder=" Enter Your Email">
                <i class="fa-regular fa-user icon"></i>
                <p id="signupEmailError" class="showerror"></p>

            </div>
            <div class="input-box">
                <input type="password" id="createPassword" oninput="createPasswordError.style.display = 'none' "
                    placeholder="Create Password">
                <i class="fa-solid fa-lock icon"></i>
                <p id="createPasswordError" class="showerror"></p>

            </div>
            <div class="input-box">
                <input type="password" id="confirm-password" oninput="signupConfirmPassError.style.display = 'none' "
                    placeholder=" Confirm-Password">
                <i class="fa-solid fa-lock icon"></i>
                <p id="signupConfirmPassError" class="showerror"></p>

            </div>


            <button id="signupBtn" type="submit">Sign up</button>
            <div class="register-link">
                Already have an account?<a onclick="showlogin()"> Login now</a>
            </div>

        </form>


    </div>




    <div id="myModal" class="modal">
        <div class="modal-content">
            <h2 style="font-size: 45px;">Sign up Completed</h2>
            <span class="close" onclick="closeModal()">&times;</span>
            <button class="openlogin" onclick="showlogin() ,closeModal()">Login now </button>
        </div>
    </div>




    <!-- login -->
    <div id="loginPage" class="login-container" style="display: none;">

        <form id="loginForm">

            <h1>Login</h1>
            <div class="input-box">
                <input type="text" id="name" oninput="nameAlert.style.display = 'none'" name="Username"
                    placeholder="Username">
                <i class="fa-regular fa-user icon"></i>
                <p id="nameAlert" class="showerror"><i class="fa-solid fa-circle-exclamation"></i> Enter a valid name
                </p>
            </div>
            <div class="input-box">
                <input type="password" id="password" onclick="passAlert.style.display = 'none'" placeholder="Password">
                <i class="fa-solid fa-lock icon"></i>
                <p id="passAlert" class="showerror"> </p>


            </div>
            <div class="remember-forgot">
                <label> <input id="remember" type="checkbox">Remember me</label>
                <a id="Forgot" href="">Forgot Password?</a>
            </div>
            <button id="btn" type="submit">Login</button>
            <div class="register-link">
                Don't have an account?<a onclick="hideLogin() "> Signup</a>
            </div>

        </form>
    </div>





    <script>

        //signup
        const form1 = document.querySelector("#form1");

        form1.addEventListener("submit", (event) => {
            event.preventDefault();

            const signupName = document.querySelector("#signupName").value.trim();

            const signupEmail = document.querySelector("#signupEmail").value.trim();

            const createPassword = document.querySelector("#createPassword").value;

            const confirmPassword = document.querySelector("#confirm-password").value;

            const signupNameError = document.querySelector("#signupNameError")

            const signupEmailError = document.querySelector("#signupEmailError")

            const createPasswordError = document.querySelector("#createPasswordError")

            const signupConfirmPassError = document.querySelector("#signupConfirmPassError")

            const signupBtn = document.querySelector("#signupBtn");
            signupBtn.classList.add("click");

            setTimeout(() => {
                if (signupName === "") {
                    // alert("Enter a valid name");
                    signupNameError.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> Enter a name!`;
                    signupNameError.style.display = "block"
                }
                else if (!/[^\s@]+@[^\s@]+[^\s@]+$/.test(signupEmail)) {
                    // alert("Enter a valid email")
                    signupEmailError.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> Enter a valid email!`;
                    signupEmailError.style.display = "block"
                }
                else if (createPassword.length < 8) {
                    // alert("Password must be at least 8 characters");
                    createPasswordError.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> Password must be at least 8 characters`;
                    createPasswordError.style.display = "block";
                }
                else if (confirmPassword != createPassword) {
                    // alert("Password does not match");
                    signupConfirmPassError.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> Password does not match`
                    signupConfirmPassError.style.display = "block"

                }
                else {
                    openModal()
                    localStorage.setItem("name", signupName,);
                    localStorage.setItem("email", signupEmail,);    // I KNOW ITS WORNG 
                    localStorage.setItem("password", createPassword);
                    form1.reset();
                }

            }, 100)

            setTimeout(() => {
                signupBtn.classList.remove("click")
            }, 300)

        });






        //login

        const loginForm = document.querySelector("#loginForm");
        const forget = document.querySelector("#Forgot");

        forget.addEventListener("click", () => {
            alert("Such a irresponsible person🤣");
        });


        loginForm.addEventListener("submit", (event) => {

            event.preventDefault();

            const name = document.querySelector("#name").value.trim();
            const password = document.querySelector("#password").value;
            const passAlert = document.querySelector("#passAlert")

            btn.classList.add("click")

            setTimeout(() => {

                if (name != localStorage.getItem("name", name) && name !== "harsh") {
                    document.querySelector("#nameAlert").style.display = "block"

                }
                else if (password.length < 8) {
                    passAlert.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Password must be at least 8 characters';
                    passAlert.style.display = "block";

                }
                else if (password != localStorage.getItem("password", password) && password != 123321123) {
                    passAlert.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> Enter a valid password`
                    passAlert.style.display = "block"

                }
                else {
                    alert(" login Successful");
                    // window.open("https://my-portfolio-harshbytes.vercel.app/")
                    window.location.href = "https://my-portfolio-harshbytes.vercel.app/"
                    loginForm.reset();

                }

            }, 100)

            setTimeout(() => {
                btn.classList.remove("click")
            }, 300)



        });


        function showlogin() {
            document.querySelector("#signupPage").style.display = "none"
            document.querySelector("#loginPage").style.display = "block"
        };



        function hideLogin() {
            document.querySelector("#signupPage").style.display = "block"
            document.querySelector("#loginPage").style.display = "none"

        }


        function closeModal() {
            document.querySelector("#myModal").style.display = "none"
        }


        function openModal() {
            document.querySelector("#myModal").style.display = "block"

        }

        


    </script>
</body>

</html>
